            {q: "P: very<br>Q: it is<br>R: cold<br>S: today", options: ["QPRS", "PQRS", "QSRP", "SRPQ"], correct: 0, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-emerald-400 text-xs uppercase mb-1">Logic</p><p class="text-slate-200">'It is' (Q) 'very' (P) 'cold' (R) 'today' (S).</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">আজ (S) খুব (P) ঠান্ডা (R)। (QPRS)।</p></div></div>`},
            {q: "P: in the river<br>Q: swimming<br>R: are<br>S: boys", options: ["SRPQ", "SRQP", "PQRS", "QPRS"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-emerald-400 text-xs uppercase mb-1">Logic</p><p class="text-slate-200">'Boys' (S) 'are' (R) 'swimming' (Q) 'in the river' (P).</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">ছেলেরা (S) সাঁতার কাটছে (RQ) নদীতে (P)।</p></div></div>`},
            {q: "P: honesty<br>Q: never<br>R: goes<br>S: unrewarded", options: ["PQRS", "PRQS", "PQRS", "PQRS"], correct: 0, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-emerald-400 text-xs uppercase mb-1">Logic</p><p class="text-slate-200">'Honesty' (P) 'never' (Q) 'goes' (R) 'unrewarded' (S).</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">সততা (P) কখনও (Q) বিফলে যায় না (RS)।</p></div></div>`},
            {q: "P: to visit<br>Q: us<br>R: he comes<br>S: often", options: ["RSQP", "RQSP", "PQRS", "SRPQ"], correct: 0, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-emerald-400 text-xs uppercase mb-1">Logic</p><p class="text-slate-200">'He comes' (R) 'often' (S) 'to visit' (P) 'us' (Q). Or 'He often comes to visit us'. R-S-P-Q. Note: 'often' usually comes before main verb but here 'comes' is main. 'He comes often' is also acceptable.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">সে (R) প্রায়ই (S) আসে আমাদের দেখতে (PQ)।</p></div></div>`},
            {q: "P: is<br>Q: health<br>R: wealth<br>S: good", options: ["SQPR", "QPRS", "PQRS", "SRPQ"], correct: 0, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-emerald-400 text-xs uppercase mb-1">Logic</p><p class="text-slate-200">'Good' (S) 'health' (Q) 'is' (P) 'wealth' (R).</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">সুস্বাস্থ্যই (SQ) সম্পদ (PR)।</p></div></div>`},
            {q: "P: early<br>Q: to rise<br>R: is<br>S: a good habit", options: ["QPRS", "QPSR", "PQRS", "QRPS"], correct: 0, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-emerald-400 text-xs uppercase mb-1">Logic</p><p class="text-slate-200">'To rise' (Q) 'early' (P) 'is' (R) 'a good habit' (S).</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">সকালে ওঠা (QP) একটি ভালো অভ্যাস (RS)।</p></div></div>`},
            {q: "P: the bird<br>Q: flew<br>R: away<br>S: quickly", options: ["PQRS", "PRQS", "PQSR", "SRPQ"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-emerald-400 text-xs uppercase mb-1">Logic</p><p class="text-slate-200">'The bird' (P) 'flew' (Q) 'away' (R) 'quickly' (S)? Or 'flew quickly away'? Usually 'flew away quickly'. PQRS.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">পাখিটি (P) দ্রুত (S) উড়ে গেল (QR)। PQSR or PQRS.</p></div></div>`},
            {q: "P: of nature<br>Q: enjoy<br>R: we should<br>S: the beauty", options: ["RQSP", "PQRS", "RQPS", "SRPQ"], correct: 0, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-emerald-400 text-xs uppercase mb-1">Logic</p><p class="text-slate-200">'We should' (R) 'enjoy' (Q) 'the beauty' (S) 'of nature' (P).</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">আমাদের উচিত (R) উপভোগ করা (Q) প্রকৃতির সৌন্দর্য (SP)।</p></div></div>`},
            {q: "P: a lot of<br>Q: money<br>R: he has<br>S: earned", options: ["RSPQ", "PQRS", "RSQP", "SRPQ"], correct: 0, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-emerald-400 text-xs uppercase mb-1">Logic</p><p class="text-slate-200">'He has' (R) 'earned' (S) 'a lot of' (P) 'money' (Q).</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">সে (R) উপার্জন করেছে (S) প্রচুর (P) টাকা (Q)।</p></div></div>`},
            {q: "P: in the sky<br>Q: stars<br>R: are twinkling<br>S: the", options: ["SQRP", "PQRS", "SQPR", "SRPQ"], correct: 0, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-emerald-400 text-xs uppercase mb-1">Logic</p><p class="text-slate-200">'The' (S) 'stars' (Q) 'are twinkling' (R) 'in the sky' (P).</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">তারাগুলো (SQ) আকাশে (P) ঝিকমিক করছে (R)।</p></div></div>`},
            {q: "P: English<br>Q: she speaks<br>R: fluently<br>S: very", options: ["QPSR", "QPRS", "PQRS", "SRPQ"], correct: 0, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-emerald-400 text-xs uppercase mb-1">Logic</p><p class="text-slate-200">'She speaks' (Q) 'English' (P) 'very' (S) 'fluently' (R).</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">সে ইংরেজি বলে (QP) খুব সাবলীলভাবে (SR)।</p></div></div>`}
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;
        let startTime;

        // Elements
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const currentQNum = document.getElementById('current-q-num');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress-bar');
        const feedbackSection = document.getElementById('feedback-section');
        const feedbackMessage = document.getElementById('feedback-message');
        const explanationContent = document.getElementById('explanation-content');
        const toggleExplanationBtn = document.getElementById('toggle-explanation-btn');
        const nextBtn = document.getElementById('next-btn');
        const finishBtn = document.getElementById('finish-btn');

        // Functions
        function loadQuestion() {
            const q = questionsTest26[currentQuestion];
            answered = false;
            
            // Update UI
            currentQNum.innerText = currentQuestion + 1;
            // Render PQRS layout
            questionText.innerHTML = `<span class="block text-emerald-200 mb-2 border-b border-emerald-500/30 pb-2 text-sm uppercase tracking-widest">Rearrange the parts:</span>${q.q}`;
            scoreDisplay.innerText = `Score: ${score}`;
            
            // Update Progress Bar
            const progress = ((currentQuestion) / questionsTest26.length) * 100;
            progressBar.style.width = `${progress}%`;

            // Reset Feedback
            feedbackSection.classList.add('hidden');
            explanationContent.classList.add('hidden');
            explanationContent.innerHTML = q.explanation;
            toggleExplanationBtn.innerHTML = '<span class="bg-emerald-500/10 p-2 rounded-lg mr-3"><i class="fas fa-lightbulb"></i></span><span class="underline decoration-emerald-500/30 underline-offset-4">See Detailed Solution</span>';
            nextBtn.classList.add('hidden');
            finishBtn.classList.add('hidden');

            // Render Options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-center p-4 rounded-xl border border-slate-700/50 bg-slate-800/40 hover:bg-slate-700/60 hover:border-emerald-500/50 transition-all duration-200 font-bold text-slate-300 text-lg group backdrop-blur-sm shadow-md";
                btn.innerHTML = `<span class="group-hover:text-emerald-400 transition-colors">${opt}</span>`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, selectedBtn) {
            if (answered) return;
            answered = true;
            
            const q = questionsTest26[currentQuestion];
            const allBtns = optionsContainer.children;
            
            if (selectedIndex === q.correct) {
                score++;
                selectedBtn.className = "w-full text-center p-4 rounded-xl border border-green-500 bg-green-500/10 transition-all shadow-[0_0_15px_rgba(34,197,94,0.2)] font-bold text-white";
                selectedBtn.innerHTML = `${q.options[selectedIndex]} <i class="fas fa-check-circle ml-2"></i>`;
                
                feedbackMessage.className = "flex items-center mb-6 p-4 rounded-xl bg-green-900/20 border border-green-500/30 text-green-300";
                feedbackMessage.innerHTML = '<div class="w-10 h-10 rounded-full bg-green-500/20 flex items-center justify-center mr-4"><i class="fas fa-check text-green-400"></i></div> <span class="font-bold">Correct Sequence!</span>';
            } else {
                selectedBtn.className = "w-full text-center p-4 rounded-xl border border-red-500 bg-red-500/10 transition-all font-bold text-red-100";
                selectedBtn.innerHTML = `${q.options[selectedIndex]} <i class="fas fa-times-circle ml-2"></i>`;
                
                const correctBtn = allBtns[q.correct];
                correctBtn.className = "w-full text-center p-4 rounded-xl border border-green-500 bg-green-500/10 transition-all shadow-[0_0_15px_rgba(34,197,94,0.2)] font-bold text-white opacity-100";
                correctBtn.innerHTML = `${q.options[q.correct]} <i class="fas fa-check-circle ml-2"></i>`;

                feedbackMessage.className = "flex items-center mb-6 p-4 rounded-xl bg-red-900/20 border border-red-500/30 text-red-300";
                feedbackMessage.innerHTML = `<div class="w-10 h-10 rounded-full bg-red-500/20 flex items-center justify-center mr-4"><i class="fas fa-times text-red-400"></i></div> <span>Incorrect. The correct order is <span class="font-bold text-green-400 border-b border-green-400/30 pb-0.5">${q.options[q.correct]}</span></span>`;
            }

            for (let btn of allBtns) {
                btn.disabled = true;
                if (!btn.className.includes('green') && !btn.className.includes('red')) {
                     btn.classList.add('opacity-50', 'cursor-not-allowed');
                     btn.classList.remove('hover:bg-slate-700/60', 'hover:border-emerald-500/50');
                }
            }

            feedbackSection.classList.remove('hidden');
            scoreDisplay.innerText = `Score: ${score}`;

            if (currentQuestion < questionsTest26.length - 1) {
                nextBtn.classList.remove('hidden');
            } else {
                finishBtn.classList.remove('hidden');
            }
        }

        function toggleExplanation() {
            if (explanationContent.classList.contains('hidden')) {
                explanationContent.classList.remove('hidden');
                explanationContent.classList.add('fade-in');
                toggleExplanationBtn.innerHTML = '<span class="bg-emerald-500/10 p-2 rounded-lg mr-3"><i class="fas fa-eye-slash"></i></span><span class="underline decoration-emerald-500/30 underline-offset-4">Hide Solution</span>';
            } else {
                explanationContent.classList.add('hidden');
                toggleExplanationBtn.innerHTML = '<span class="bg-emerald-500/10 p-2 rounded-lg mr-3"><i class="fas fa-lightbulb"></i></span><span class="underline decoration-emerald-500/30 underline-offset-4">See Detailed Solution</span>';
            }
        }

        function nextQuestion() {
            currentQuestion++;
            loadQuestion();
        }

        function finishQuiz() {
            const endTime = new Date();
            const timeDiff = Math.floor((endTime - startTime) / 1000); // seconds
            const minutes = Math.floor(timeDiff / 60);
            const seconds = timeDiff % 60;
            const timeString = `${minutes}m ${seconds}s`;
            
            // Calc stats
            const total = questionsTest26.length;
            const accuracy = Math.round((score / total) * 100);
            const wrongAnswers = total - score;
            const sscScore = (score * 2) - (wrongAnswers * 0.5);
            
            // Get user name from URL params to pass it back
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name') || "Student";

            // Redirect to Master Index with results (Action = result)
            // Note: testId is set to test26
            const redirectUrl = `index.html?action=result&score=${score}&total=${total}&accuracy=${accuracy}&time=${encodeURIComponent(timeString)}&sscScore=${sscScore}&name=${encodeURIComponent(name)}&testId=test26`;
            
            window.location.href = redirectUrl;
        }
        
        // Start on load
        window.onload = function() {
            startTime = new Date();
            loadQuestion();
        };

        // Expose to window for buttons
        window.checkAnswer = checkAnswer;
        window.toggleExplanation = toggleExplanation;
        window.nextQuestion = nextQuestion;
        window.finishQuiz = finishQuiz;
    </script>
</body>
</html>
