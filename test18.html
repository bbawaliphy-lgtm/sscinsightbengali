<body class="min-h-screen flex flex-col items-center justify-center p-4">

                </button>

    <script>
        // Test Data (Test 18 - Sentence Improvement Set 3)
        const questionsTest18 = [
            {q: "He is senior _____ me.", options: ["than", "from", "to", "over"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">Latin Comparatives ending in '-ior' (senior, junior, superior, inferior) are followed by 'to', not 'than'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">Senior, Junior, Superior ইত্যাদি শব্দের পরে 'than' বসে না, 'to' বসে।</p></div></div>`},
            {q: "Hardly had I reached the station _____ the train left.", options: ["than", "then", "when", "while"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'Hardly' and 'Scarcely' are always followed by 'when'. 'No sooner' is followed by 'than'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Hardly' বা 'Scarcely' থাকলে বাক্যের অপর অংশে 'when' বসে।</p></div></div>`},
            {q: "One of the boys _____ missing.", options: ["are", "is", "have", "were"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'One of the' is followed by a plural noun but takes a singular verb.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'One of the' এর পরে Noun টি plural হয় কিন্তু Verb টি singular (is) হয়।</p></div></div>`},
            {q: "Unless you work hard, you _____ succeed.", options: ["will not", "will", "do not", "can"], correct: 0, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'Unless' provides the condition (negative meaning), so the main clause usually requires a negative result to make logical sense.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Unless' মানে 'যদি না'। তাই মূল অংশে 'will not' বা নেতিবাচক শব্দ বসে।</p></div></div>`},
            {q: "He prevented me _____ going there.", options: ["to", "from", "of", "with"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'Prevent', 'Prohibit', 'Abstain', 'Refrain' take the preposition 'from' followed by a Gerund (V+ing).</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">বাধা দেওয়া বা বিরত থাকা অর্থে 'prevent from' বসে।</p></div></div>`},
            {q: "I prefer coffee _____ tea.", options: ["than", "to", "over", "from"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'Prefer' takes the preposition 'to' when comparing two nouns/things.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">পছন্দ করার ক্ষেত্রে তুলনার সময় 'prefer to' বসে।</p></div></div>`},
            {q: "If I _____ a king, I would help the poor.", options: ["was", "am", "were", "had been"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">In hypothetical/imaginary situations (Subjunctive Mood), 'were' is used with all subjects.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">অবাস্তব কল্পনা বোঝালে সব Subject-এর সাথেই 'were' বসে।</p></div></div>`},
            {q: "Neither of the two candidates _____ suitable.", options: ["is", "are", "have", "were"], correct: 0, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'Neither of' takes a singular verb.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Neither of' এর পরে Verb টি singular (is) হয়।</p></div></div>`},
            {q: "Each of the girls _____ a pen.", options: ["have", "has", "are", "were"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'Each of' takes a singular verb.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Each of' থাকলে Verb সর্বদা Singular (has) হয়।</p></div></div>`},
            {q: "Bread and butter _____ my favorite breakfast.", options: ["are", "is", "have", "were"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">When two nouns express a single idea or unit, the verb is singular.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">Bread and butter একটি একক খাবার বোঝাচ্ছে, তাই Verb singular (is) হবে।</p></div></div>`},
            {q: "The scenery of Kashmir _____ beautiful.", options: ["are", "is", "have", "were"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'Scenery' is an uncountable noun and takes a singular verb.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Scenery' শব্দটি সর্বদা singular, তাই Verb ও singular (is) হবে।</p></div></div>`},
            {q: "No sooner had I reached the station _____ the train left.", options: ["then", "when", "than", "before"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'No sooner' is always followed by 'than'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'No sooner' থাকলে বাক্যের অপর অংশে 'than' বসে।</p></div></div>`},
            {q: "He died _____ malaria.", options: ["from", "of", "by", "with"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">Use 'die of' for diseases. Use 'die from' for other causes (e.g., overeating, wounds).</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">রোগে মারা গেলে 'die of' বসে।</p></div></div>`},
            {q: "He is accused _____ murder.", options: ["with", "for", "of", "in"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'Accused' is followed by the preposition 'of'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Accused' (অভিযুক্ত) এর পরে সর্বদা 'of' বসে।</p></div></div>`},
            {q: "We should abide _____ the rules.", options: ["with", "to", "by", "on"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'Abide by' means to obey or follow a rule/decision.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">নিয়ম মেনে চলা অর্থে 'abide by' বসে।</p></div></div>`},
            {q: "He is good _____ English.", options: ["in", "at", "on", "for"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">We use 'good at' to talk about ability or skill.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">দক্ষতা বোঝালে 'good at' বসে। 'Good in' ভুল।</p></div></div>`},
            {q: "This is the boy _____ stole my pen.", options: ["whom", "who", "which", "whose"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'Who' is used as a subject relative pronoun for people.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">ব্যক্তি বোঝালে এবং Subject হিসেবে বসলে 'who' ব্যবহৃত হয়।</p></div></div>`},
            {q: "He has been living here _____ 2010.", options: ["for", "from", "since", "in"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'Since' is used for a specific point in time in Perfect Continuous tenses.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">নির্দিষ্ট সময় (Point of time) বোঝালে 'since' বসে।</p></div></div>`},
            {q: "I have been waiting _____ two hours.", options: ["since", "from", "for", "in"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'For' is used for a duration or period of time.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">সময়ের ব্যাপ্তি (Duration) বোঝালে 'for' বসে।</p></div></div>`},
            {q: "She is married _____ a doctor.", options: ["with", "to", "by", "of"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'Married to' is the correct preposition when indicating status or relationship.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">কারোর সাথে বিয়ে হয়েছে বোঝাতে 'married to' বসে, 'with' নয়।</p></div></div>`},
            {q: "The police _____ investigating the case.", options: ["is", "are", "has", "was"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'Police' is a plural noun and takes a plural verb.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Police' শব্দটি Plural, তাই 'are' হবে।</p></div></div>`},
            {q: "I look forward to _____ you.", options: ["meet", "meeting", "met", "have met"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'Look forward to' is followed by a Gerund (V+ing).</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Look forward to' এর পরে verb-এর সাথে 'ing' যুক্ত হয়।</p></div></div>`},
            {q: "Fifty kilometers _____ a long distance.", options: ["are", "were", "is", "have"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">Distances, sums of money, etc., take a singular verb when considered as a unit.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">দূরত্ব বোঝালে Verb singular (is) হয়।</p></div></div>`},
            {q: "Neither of the boys _____ present.", options: ["were", "are", "is", "have"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'Neither of' takes a singular verb.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Neither of' এর পরে Verb টি singular (is) হয়।</p></div></div>`},
            {q: "It is time we _____ home.", options: ["go", "went", "have gone", "will go"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-purple-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">After 'It is time' or 'It is high time', the verb is in the Past Indefinite tense.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'It is time' এর পরে subject থাকলে verb-এর Past form (went) বসে।</p></div></div>`}
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;
        let startTime;

        // Elements
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const currentQNum = document.getElementById('current-q-num');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress-bar');
        const feedbackSection = document.getElementById('feedback-section');
        const feedbackMessage = document.getElementById('feedback-message');
        const explanationContent = document.getElementById('explanation-content');
        const toggleExplanationBtn = document.getElementById('toggle-explanation-btn');
        const nextBtn = document.getElementById('next-btn');
        const finishBtn = document.getElementById('finish-btn');

        // Functions
        function loadQuestion() {
            const q = questionsTest18[currentQuestion];
            answered = false;
            
            // Update UI
            currentQNum.innerText = currentQuestion + 1;
            questionText.innerText = q.q;
            scoreDisplay.innerText = `Score: ${score}`;
            
            // Update Progress Bar
            const progress = ((currentQuestion) / questionsTest18.length) * 100;
            progressBar.style.width = `${progress}%`;

            // Reset Feedback
            feedbackSection.classList.add('hidden');
            explanationContent.classList.add('hidden');
            explanationContent.innerHTML = q.explanation;
            toggleExplanationBtn.innerHTML = '<span class="bg-purple-500/10 p-2 rounded-lg mr-3"><i class="fas fa-lightbulb"></i></span><span class="underline decoration-purple-500/30 underline-offset-4">See Detailed Solution</span>';
            nextBtn.classList.add('hidden');
            finishBtn.classList.add('hidden');

            // Render Options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-5 rounded-xl border border-slate-700/50 bg-slate-800/40 hover:bg-slate-700/60 hover:border-purple-500/50 transition-all duration-200 font-medium text-slate-300 flex justify-between items-center group backdrop-blur-sm";
                btn.innerHTML = `<span class="flex items-center"><span class="w-8 h-8 rounded-full bg-slate-700 text-slate-400 flex items-center justify-center font-bold mr-4 group-hover:bg-purple-500 group-hover:text-slate-900 transition-colors text-sm">${String.fromCharCode(65 + index)}</span> ${opt}</span>`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, selectedBtn) {
            if (answered) return;
            answered = true;
            
            const q = questionsTest18[currentQuestion];
            const allBtns = optionsContainer.children;
            
            if (selectedIndex === q.correct) {
                score++;
                selectedBtn.className = "w-full text-left p-5 rounded-xl border border-green-500 bg-green-500/10 flex justify-between items-center transition-all shadow-[0_0_15px_rgba(34,197,94,0.2)]";
                selectedBtn.innerHTML = `<span class="flex items-center text-white font-bold"><span class="w-8 h-8 rounded-full bg-green-500 text-slate-900 flex items-center justify-center font-bold mr-4 text-sm">${String.fromCharCode(65 + selectedIndex)}</span> ${q.options[selectedIndex]}</span><i class="fas fa-check-circle text-green-400 text-2xl drop-shadow-lg"></i>`;
                
                feedbackMessage.className = "flex items-center mb-6 p-4 rounded-xl bg-green-900/20 border border-green-500/30 text-green-300";
                feedbackMessage.innerHTML = '<div class="w-10 h-10 rounded-full bg-green-500/20 flex items-center justify-center mr-4"><i class="fas fa-check text-green-400"></i></div> <span class="font-bold">Correct Answer! Well done.</span>';
            } else {
                selectedBtn.className = "w-full text-left p-5 rounded-xl border border-red-500 bg-red-500/10 flex justify-between items-center transition-all";
                selectedBtn.innerHTML = `<span class="flex items-center text-red-100"><span class="w-8 h-8 rounded-full bg-red-500 text-white flex items-center justify-center font-bold mr-4 text-sm">${String.fromCharCode(65 + selectedIndex)}</span> ${q.options[selectedIndex]}</span><i class="fas fa-times-circle text-red-400 text-2xl"></i>`;
                
                const correctBtn = allBtns[q.correct];
                correctBtn.className = "w-full text-left p-5 rounded-xl border border-green-500 bg-green-500/10 flex justify-between items-center transition-all shadow-[0_0_15px_rgba(34,197,94,0.2)] opacity-100";
                correctBtn.innerHTML = `<span class="flex items-center text-white font-bold"><span class="w-8 h-8 rounded-full bg-green-500 text-slate-900 flex items-center justify-center font-bold mr-4 text-sm">${String.fromCharCode(65 + q.correct)}</span> ${q.options[q.correct]}</span><i class="fas fa-check-circle text-green-400 text-2xl"></i>`;

                feedbackMessage.className = "flex items-center mb-6 p-4 rounded-xl bg-red-900/20 border border-red-500/30 text-red-300";
                feedbackMessage.innerHTML = `<div class="w-10 h-10 rounded-full bg-red-500/20 flex items-center justify-center mr-4"><i class="fas fa-times text-red-400"></i></div> <span>Incorrect. The correct answer is <span class="font-bold text-green-400 border-b border-green-400/30 pb-0.5">${q.options[q.correct]}</span></span>`;
            }

            for (let btn of allBtns) {
                btn.disabled = true;
                if (!btn.className.includes('green') && !btn.className.includes('red')) {
                     btn.classList.add('opacity-50', 'cursor-not-allowed');
                     btn.classList.remove('hover:bg-slate-700/60', 'hover:border-purple-500/50');
                }
            }

            feedbackSection.classList.remove('hidden');
            scoreDisplay.innerText = `Score: ${score}`;

            if (currentQuestion < questionsTest18.length - 1) {
                nextBtn.classList.remove('hidden');
            } else {
                finishBtn.classList.remove('hidden');
            }
        }

        function toggleExplanation() {
            if (explanationContent.classList.contains('hidden')) {
                explanationContent.classList.remove('hidden');
                explanationContent.classList.add('fade-in');
                toggleExplanationBtn.innerHTML = '<span class="bg-purple-500/10 p-2 rounded-lg mr-3"><i class="fas fa-eye-slash"></i></span><span class="underline decoration-purple-500/30 underline-offset-4">Hide Solution</span>';
            } else {
                explanationContent.classList.add('hidden');
                toggleExplanationBtn.innerHTML = '<span class="bg-purple-500/10 p-2 rounded-lg mr-3"><i class="fas fa-lightbulb"></i></span><span class="underline decoration-purple-500/30 underline-offset-4">See Detailed Solution</span>';
            }
        }

        function nextQuestion() {
            currentQuestion++;
            loadQuestion();
        }

        function finishQuiz() {
            const endTime = new Date();
            const timeDiff = Math.floor((endTime - startTime) / 1000); // seconds
            const minutes = Math.floor(timeDiff / 60);
            const seconds = timeDiff % 60;
            const timeString = `${minutes}m ${seconds}s`;
            
            // Calc stats
            const total = questionsTest18.length;
            const accuracy = Math.round((score / total) * 100);
            const wrongAnswers = total - score;
            const sscScore = (score * 2) - (wrongAnswers * 0.5);
            
            // Get user name from URL params to pass it back
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name') || "Student";

            // Redirect to Master Index with results (Action = result)
            // Note: testId is set to test18
            const redirectUrl = `index.html?action=result&score=${score}&total=${total}&accuracy=${accuracy}&time=${encodeURIComponent(timeString)}&sscScore=${sscScore}&name=${encodeURIComponent(name)}&testId=test18`;
            
            window.location.href = redirectUrl;
        }
        
        // Start on load
        window.onload = function() {
            startTime = new Date();
            loadQuestion();
        };

        // Expose to window for buttons
        window.checkAnswer = checkAnswer;
        window.toggleExplanation = toggleExplanation;
        window.nextQuestion = nextQuestion;
        window.finishQuiz = finishQuiz;
    </script>
</body>
</html>
