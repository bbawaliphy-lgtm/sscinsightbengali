<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <header class="fixed top-0 left-0 right-0 p-4 flex justify-between items-center z-50 bg-slate-900/50 backdrop-blur">
         <div class="flex items-center text-slate-300">
             <i class="fas fa-arrow-left mr-2 cursor-pointer hover:text-white" onclick="history.back()"></i>
             <span class="font-bold">Test 17: Spotting Errors (Set 2)</span>

                     <span class="w-2 h-2 rounded-full bg-blue-600 animate-pulse"></span>
                     <span class="text-sm font-bold text-slate-300 tracking-wide">Question <span id="current-q-num" class="text-white text-base">1</span><span class="text-slate-500">/25</span></span>

            <div class="p-6 md:p-10">

                    <!-- Toggle Explanation Button -->

                        <span class="bg-blue-500/10 p-2 rounded-lg mr-3 group-hover:bg-blue-500/20 transition-colors"><i class="fas fa-lightbulb"></i></span>
                        <span class="underline decoration-blue-500/30 underline-offset-4 group-hover:decoration-blue-500">See Detailed Solution</span>
                    </button>

                    <!-- Detailed Explanation Content -->
                    <div id="explanation-content" class="hidden bg-slate-900/60 p-6 rounded-2xl border border-slate-700/50 text-slate-300 custom-scroll max-h-96 overflow-y-auto shadow-inner leading-relaxed">
                        <!-- Explanation injected by JS -->
                    </div>
                </div>
            </div>

            <!-- Footer Navigation -->
            <div class="bg-slate-900/40 px-6 py-5 border-t border-slate-700/50 flex justify-end">
                <button id="next-btn" onclick="nextQuestion()" class="hidden bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-blue-900/20 transition-all transform hover:-translate-y-0.5 flex items-center">
                    Next Question <i class="fas fa-arrow-right ml-2"></i>
                </button>
                <button id="finish-btn" onclick="finishQuiz()" class="hidden bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-yellow-900/20 transition-all transform hover:-translate-y-0.5 flex items-center">
                    Finish Test <i class="fas fa-flag-checkered ml-2"></i>
                </button>

        </div>
    </div>

    <script>
        // Test Data (Test 17 - Spotting Errors Set 2)
        const questionsTest17 = [
            {q: "Identify the error: 'He is / the most / unique / person.'", options: ["He is", "the most", "unique", "person"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">'Unique' is an absolute adjective meaning 'one of a kind'. It cannot be graded with 'more' or 'most'. Correct: 'He is a unique person'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Unique' মানে অদ্বিতীয়, তাই এর আগে 'more' বা 'most' বসে না।</p></div></div>`},
            {q: "Identify the error: 'All the / evidences / were / against him.'", options: ["All the", "evidences", "were", "against him"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">'Evidence' is an uncountable noun and does not have a plural form like 'evidences'. It takes a singular verb.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Evidence' সর্বদা singular, এর সাথে 's' যোগ করা যায় না।</p></div></div>`},
            {q: "Identify the error: 'He has / bought / five dozens / eggs.'", options: ["He has", "bought", "five dozens", "eggs"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">When a definite numeral adjective (five) precedes a noun like dozen, hundred, thousand, the noun remains singular. Correct: 'five dozen eggs'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">সংখ্যার পরে Dozen, Hundred, Thousand থাকলে সেগুলো Singular হয় (s যোগ হয় না)।</p></div></div>`},
            {q: "Identify the error: 'I am / working here / since / 2010.'", options: ["I am", "working here", "since", "2010"], correct: 0, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">When an action started in the past and continues to the present, we use Present Perfect Continuous Tense. Correct: 'I have been working here'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">অতীত থেকে শুরু হয়ে এখনও চলছে বোঝালে 'have been working' হবে, 'am working' নয়।</p></div></div>`},
            {q: "Identify the error: 'Let / you and I / solve / this problem.'", options: ["Let", "you and I", "solve", "this problem"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">'Let' is a verb and is followed by the objective case of the pronoun. Correct: 'Let you and me'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Let' এর পর Pronoun-এর Objective form (me, him, her) বসে। 'I' ভুল।</p></div></div>`},
            {q: "Identify the error: 'The quality / of the apples / are / good.'", options: ["The quality", "of the apples", "are", "good"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">The subject is 'Quality' (singular), not 'apples'. Therefore, the verb should be singular. Correct: 'is good'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">Subject হলো 'Quality' (Singular), তাই Verb 'is' হবে।</p></div></div>`},
            {q: "Identify the error: 'He resembles / to / his / father.'", options: ["He resembles", "to", "his", "father"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">'Resemble' is a transitive verb and does not take a preposition. Correct: 'He resembles his father'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Resemble' এর পরে 'to' বা 'with' বসে না।</p></div></div>`},
            {q: "Identify the error: 'More than / one student / have / passed.'", options: ["More than", "one student", "have", "passed"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">'More than one' is followed by a singular noun and a singular verb. Correct: 'has passed'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'More than one' থাকলে Noun ও Verb দুটোই Singular হয়।</p></div></div>`},
            {q: "Identify the error: 'She is / more wiser / than / her sister.'", options: ["She is", "more wiser", "than", "her sister"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">Double comparative ('more wiser') is incorrect. 'Wiser' is already a comparative form. Correct: 'She is wiser than...'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Wiser' নিজেই Comparative, তাই এর আগে 'more' বসালে ভুল হয় (Double Comparative)।</p></div></div>`},
            {q: "Identify the error: 'I ordered / for / a cup / of tea.'", options: ["I ordered", "for", "a cup", "of tea"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">'Order' is a transitive verb and takes a direct object. 'For' is superfluous. Correct: 'I ordered a cup of tea'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Order' এর পরে 'for' বসে না।</p></div></div>`},
            {q: "Identify the error: 'The prisoner / was / hung / till death.'", options: ["The prisoner", "was", "hung", "till death"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">'Hung' is the past participle of 'hang' (to suspend things). For execution, the past participle is 'hanged'. Correct: 'was hanged'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">ফাঁসি দেওয়া অর্থে 'hanged' বসে। কোনো কিছু ঝোলানো অর্থে 'hung' বসে।</p></div></div>`},
            {q: "Identify the error: 'Both / Ram / as well as / Shyam are going.'", options: ["Both", "Ram", "as well as", "Shyam are going"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">'Both' is followed by 'and', not 'as well as'. Correct: 'Both Ram and Shyam'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Both' এর সাথে জোড়া শব্দ হিসেবে 'and' বসে।</p></div></div>`},
            {q: "Identify the error: 'He asked / that / why / I was late.'", options: ["He asked", "that", "why", "I was late"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">In Indirect Speech, if a Wh-word (why, who, where) connects the clauses, 'that' is not used. Correct: 'He asked why I was late'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">Wh-word দিয়ে বাক্য যুক্ত হলে তার আগে 'that' বসে না।</p></div></div>`},
            {q: "Identify the error: 'I / look forward / to hear / from you.'", options: ["I", "look forward", "to hear", "from you"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">The phrase 'look forward to' is followed by a Gerund (V+ing). Correct: 'to hearing'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Look forward to' এর পরে verb-এর সাথে 'ing' যুক্ত হয়।</p></div></div>`},
            {q: "Identify the error: 'He is / a / M.L.A. / from this area.'", options: ["He is", "a", "M.L.A.", "from this area"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">The abbreviation 'M.L.A.' starts with a vowel sound ('Em'), so it takes 'an'. Correct: 'He is an M.L.A.'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">M.L.A. উচ্চারণে 'এ' (Em) আসে, তাই এর আগে 'an' বসে।</p></div></div>`},
            {q: "Identify the error: 'He made / a / big / blunder.'", options: ["He made", "a", "big", "blunder"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">'Blunder' means a big mistake. Using 'big' with 'blunder' is superfluous. Correct: 'He made a blunder'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Blunder' মানেই বড় ভুল, তাই এর আগে 'big' শব্দটি অতিরিক্ত (Superfluous)।</p></div></div>`},
            {q: "Identify the error: 'Do you / mind / to open / the window?'", options: ["Do you", "mind", "to open", "the window"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">The verb 'mind' is followed by a Gerund (V+ing). Correct: 'opening'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Mind' এর পরে সর্বদা Verb+ing বসে।</p></div></div>`},
            {q: "Identify the error: 'Neither / he nor I / are / going.'", options: ["Neither", "he nor I", "are", "going"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">When subjects are joined by 'neither...nor', the verb agrees with the nearest subject. Nearest subject is 'I', so use 'am'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Nor' এর পরে থাকা Subject (I) অনুযায়ী verb হবে। তাই 'am' হবে।</p></div></div>`},
            {q: "Identify the error: 'Please / await / for / the result.'", options: ["Please", "await", "for", "the result"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">'Await' means 'wait for'. Using 'for' with 'await' is superfluous. Correct: 'Please await the result' or 'Please wait for the result'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Await' এর সাথে 'for' বসে না।</p></div></div>`},
            {q: "Identify the error: 'Under no circumstances / you should / leave / the room.'", options: ["Under no circumstances", "you should", "leave", "the room"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">When a sentence starts with a negative phrase like 'Under no circumstances', inversion is used. Correct: 'should you'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">বাক্যের শুরুতে Negative Phrase থাকলে Inversion হয় (Verb আগে আসে)। তাই 'should you' হবে।</p></div></div>`},
            {q: "Identify the error: 'Either of / the three boys / has done / this work.'", options: ["Either of", "the three boys", "has done", "this work"], correct: 0, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">'Either' is used for two persons/things. For more than two, use 'Any' or 'One'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">দুইয়ের অধিক হলে 'Either' বসে না, 'Any' বা 'One' বসে।</p></div></div>`},
            {q: "Identify the error: 'I need / a / passing marks / to qualify.'", options: ["I need", "a", "passing marks", "to qualify"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">The correct term is 'Pass marks', not 'Passing marks'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Passing marks' ভুল শব্দ। সঠিক শব্দ হলো 'Pass marks'।</p></div></div>`},
            {q: "Identify the error: 'If / it will rain, / I will / stay home.'", options: ["If", "it will rain,", "I will", "stay home"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">In the first conditional, the 'If' clause uses Present Simple, not Future Simple. Correct: 'If it rains'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">শর্তমূলক বাক্যের 'If' অংশে Future Tense (will) বসে না, Present Indefinite (rains) হবে।</p></div></div>`},
            {q: "Identify the error: 'My / brother-in-laws / are / coming.'", options: ["My", "brother-in-laws", "are", "coming"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">The plural of 'Brother-in-law' is 'Brothers-in-law'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">Plural করার সময় মূল শব্দের সাথে 's' যোগ করতে হয় (Brothers-in-law)।</p></div></div>`},
            {q: "Identify the error: 'He has / no house / to / live.'", options: ["He has", "no house", "to", "live"], correct: 3, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Error Analysis</p><p class="text-slate-200">When an infinitive qualifies a noun (house), the preposition must not be omitted if required. Correct: 'to live in'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">বাড়িতে বাস করা হয়, তাই 'live' এর পর 'in' বসাতে হবে।</p></div></div>`}
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;
        let startTime;

        // Elements
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const currentQNum = document.getElementById('current-q-num');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress-bar');
        const feedbackSection = document.getElementById('feedback-section');
        const feedbackMessage = document.getElementById('feedback-message');
        const explanationContent = document.getElementById('explanation-content');
        const toggleExplanationBtn = document.getElementById('toggle-explanation-btn');
        const nextBtn = document.getElementById('next-btn');
        const finishBtn = document.getElementById('finish-btn');

        // Functions
        function loadQuestion() {
            const q = questionsTest17[currentQuestion];
            answered = false;
            
            // Update UI
            currentQNum.innerText = currentQuestion + 1;
            questionText.innerText = q.q;
            scoreDisplay.innerText = `Score: ${score}`;
            
            // Update Progress Bar
            const progress = ((currentQuestion) / questionsTest17.length) * 100;
            progressBar.style.width = `${progress}%`;

            // Reset Feedback
            feedbackSection.classList.add('hidden');
            explanationContent.classList.add('hidden');
            explanationContent.innerHTML = q.explanation;
            toggleExplanationBtn.innerHTML = '<span class="bg-blue-500/10 p-2 rounded-lg mr-3"><i class="fas fa-lightbulb"></i></span><span class="underline decoration-blue-500/30 underline-offset-4">See Detailed Solution</span>';
            nextBtn.classList.add('hidden');
            finishBtn.classList.add('hidden');

            // Render Options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-5 rounded-xl border border-slate-700/50 bg-slate-800/40 hover:bg-slate-700/60 hover:border-blue-500/50 transition-all duration-200 font-medium text-slate-300 flex justify-between items-center group backdrop-blur-sm";
                btn.innerHTML = `<span class="flex items-center"><span class="w-8 h-8 rounded-full bg-slate-700 text-slate-400 flex items-center justify-center font-bold mr-4 group-hover:bg-blue-500 group-hover:text-slate-900 transition-colors text-sm">${String.fromCharCode(65 + index)}</span> ${opt}</span>`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, selectedBtn) {
            if (answered) return;
            answered = true;
            
            const q = questionsTest17[currentQuestion];
            const allBtns = optionsContainer.children;
            
            if (selectedIndex === q.correct) {
                score++;
                selectedBtn.className = "w-full text-left p-5 rounded-xl border border-green-500 bg-green-500/10 flex justify-between items-center transition-all shadow-[0_0_15px_rgba(34,197,94,0.2)]";
                selectedBtn.innerHTML = `<span class="flex items-center text-white font-bold"><span class="w-8 h-8 rounded-full bg-green-500 text-slate-900 flex items-center justify-center font-bold mr-4 text-sm">${String.fromCharCode(65 + selectedIndex)}</span> ${q.options[selectedIndex]}</span><i class="fas fa-check-circle text-green-400 text-2xl drop-shadow-lg"></i>`;
                
                feedbackMessage.className = "flex items-center mb-6 p-4 rounded-xl bg-green-900/20 border border-green-500/30 text-green-300";
                feedbackMessage.innerHTML = '<div class="w-10 h-10 rounded-full bg-green-500/20 flex items-center justify-center mr-4"><i class="fas fa-check text-green-400"></i></div> <span class="font-bold">Correct Answer! Well done.</span>';
            } else {
                selectedBtn.className = "w-full text-left p-5 rounded-xl border border-red-500 bg-red-500/10 flex justify-between items-center transition-all";
                selectedBtn.innerHTML = `<span class="flex items-center text-red-100"><span class="w-8 h-8 rounded-full bg-red-500 text-white flex items-center justify-center font-bold mr-4 text-sm">${String.fromCharCode(65 + selectedIndex)}</span> ${q.options[selectedIndex]}</span><i class="fas fa-times-circle text-red-400 text-2xl"></i>`;
                
                const correctBtn = allBtns[q.correct];
                correctBtn.className = "w-full text-left p-5 rounded-xl border border-green-500 bg-green-500/10 flex justify-between items-center transition-all shadow-[0_0_15px_rgba(34,197,94,0.2)] opacity-100";
                correctBtn.innerHTML = `<span class="flex items-center text-white font-bold"><span class="w-8 h-8 rounded-full bg-green-500 text-slate-900 flex items-center justify-center font-bold mr-4 text-sm">${String.fromCharCode(65 + q.correct)}</span> ${q.options[q.correct]}</span><i class="fas fa-check-circle text-green-400 text-2xl"></i>`;

                feedbackMessage.className = "flex items-center mb-6 p-4 rounded-xl bg-red-900/20 border border-red-500/30 text-red-300";
                feedbackMessage.innerHTML = `<div class="w-10 h-10 rounded-full bg-red-500/20 flex items-center justify-center mr-4"><i class="fas fa-times text-red-400"></i></div> <span>Incorrect. The correct segment is <span class="font-bold text-green-400 border-b border-green-400/30 pb-0.5">${q.options[q.correct]}</span></span>`;
            }

            for (let btn of allBtns) {
                btn.disabled = true;
                if (!btn.className.includes('green') && !btn.className.includes('red')) {
                     btn.classList.add('opacity-50', 'cursor-not-allowed');
                     btn.classList.remove('hover:bg-slate-700/60', 'hover:border-blue-500/50');
                }
            }

            feedbackSection.classList.remove('hidden');
            scoreDisplay.innerText = `Score: ${score}`;

            if (currentQuestion < questionsTest17.length - 1) {
                nextBtn.classList.remove('hidden');
            } else {
                finishBtn.classList.remove('hidden');
            }
        }

        function toggleExplanation() {
            if (explanationContent.classList.contains('hidden')) {
                explanationContent.classList.remove('hidden');
                explanationContent.classList.add('fade-in');
                toggleExplanationBtn.innerHTML = '<span class="bg-blue-500/10 p-2 rounded-lg mr-3"><i class="fas fa-eye-slash"></i></span><span class="underline decoration-blue-500/30 underline-offset-4">Hide Solution</span>';
            } else {
                explanationContent.classList.add('hidden');
                toggleExplanationBtn.innerHTML = '<span class="bg-blue-500/10 p-2 rounded-lg mr-3"><i class="fas fa-lightbulb"></i></span><span class="underline decoration-blue-500/30 underline-offset-4">See Detailed Solution</span>';
            }
        }

        function nextQuestion() {
            currentQuestion++;
            loadQuestion();
        }

        function finishQuiz() {
            const endTime = new Date();
            const timeDiff = Math.floor((endTime - startTime) / 1000); // seconds
            const minutes = Math.floor(timeDiff / 60);
            const seconds = timeDiff % 60;
            const timeString = `${minutes}m ${seconds}s`;
            
            // Calc stats
            const total = questionsTest17.length;
            const accuracy = Math.round((score / total) * 100);
            const wrongAnswers = total - score;
            const sscScore = (score * 2) - (wrongAnswers * 0.5);
            
            // Get user name from URL params to pass it back
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name') || "Student";

            // Redirect to Master Index with results (Action = result)
            // Note: testId is set to test17
            const redirectUrl = `index.html?action=result&score=${score}&total=${total}&accuracy=${accuracy}&time=${encodeURIComponent(timeString)}&sscScore=${sscScore}&name=${encodeURIComponent(name)}&testId=test17`;
            
            window.location.href = redirectUrl;
        }
        
        // Start on load
        window.onload = function() {
            startTime = new Date();
            loadQuestion();
        };

        // Expose to window for buttons
        window.checkAnswer = checkAnswer;
        window.toggleExplanation = toggleExplanation;
        window.nextQuestion = nextQuestion;
        window.finishQuiz = finishQuiz;
    </script>
</body>
</html>
