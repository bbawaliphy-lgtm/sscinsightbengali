</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header for Context -->
    <header class="fixed top-0 left-0 right-0 p-4 flex justify-between items-center z-50 bg-slate-900/50 backdrop-blur">
         <div class="flex items-center text-slate-300">
             <i class="fas fa-arrow-left mr-2 cursor-pointer hover:text-white" onclick="history.back()"></i>
             <span class="font-bold">Test 19: Syno/Anto (Set 3)</span>

         </div>

    <!-- Quiz Container -->
    <div id="quiz-container" class="max-w-3xl w-full mt-10">

            <!-- Question Header -->
            <div class="bg-slate-900/60 px-6 py-4 border-b border-slate-700 flex justify-between items-center backdrop-blur-sm">
                <div class="flex items-center space-x-2">
                     <span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span>
                     <span class="text-sm font-bold text-slate-300 tracking-wide">Question <span id="current-q-num" class="text-white text-base">1</span><span class="text-slate-500">/25</span></span>
                </div>
                <span id="score-display" class="text-sm font-bold text-yellow-400 bg-yellow-900/20 border border-yellow-500/30 px-4 py-1.5 rounded-full shadow-inner">Score: 0</span>
            </div>

            <!-- Question Body -->
            <div class="p-6 md:p-10">
                <h3 id="question-text" class="text-xl md:text-2xl font-bold text-white mb-8 leading-relaxed drop-shadow-sm">
                    <!-- Question goes here -->
                </h3>

                <!-- Options Grid -->
                <div id="options-container" class="grid grid-cols-1 gap-4 mb-8">
                    <!-- Buttons injected by JS -->
                </div>

                <div id="feedback-section" class="hidden mt-8 border-t border-slate-700/50 pt-8 animation-fade-in">

                    <div id="feedback-message" class="flex items-center mb-6 p-4 rounded-xl border">
                        <!-- Injected by JS -->
                    </div>

                    <!-- Toggle Explanation Button -->
                    <button id="toggle-explanation-btn" onclick="toggleExplanation()" class="group text-yellow-400 hover:text-yellow-300 font-semibold text-sm flex items-center mb-4 focus:outline-none transition-colors">
                        <span class="bg-yellow-500/10 p-2 rounded-lg mr-3 group-hover:bg-yellow-500/20 transition-colors"><i class="fas fa-lightbulb"></i></span>
                        <span class="underline decoration-yellow-500/30 underline-offset-4 group-hover:decoration-yellow-500">See Detailed Solution</span>
                    </button>

                    <!-- Detailed Explanation Content -->
                    <div id="explanation-content" class="hidden bg-slate-900/60 p-6 rounded-2xl border border-slate-700/50 text-slate-300 custom-scroll max-h-96 overflow-y-auto shadow-inner leading-relaxed">
                        <!-- Explanation injected by JS -->
                    </div>
                </div>
            </div>

            <!-- Footer Navigation -->
            <div class="bg-slate-900/40 px-6 py-5 border-t border-slate-700/50 flex justify-end">
                <button id="next-btn" onclick="nextQuestion()" class="hidden bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-yellow-900/20 transition-all transform hover:-translate-y-0.5 flex items-center">
                    Next Question <i class="fas fa-arrow-right ml-2"></i>
                </button>
                <button id="finish-btn" onclick="finishQuiz()" class="hidden bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-green-900/20 transition-all transform hover:-translate-y-0.5 flex items-center">
                    Finish Test <i class="fas fa-flag-checkered ml-2"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Test Data (Test 19 - Synonyms & Antonyms Set 3)
        const questionsTest19 = [
            {q: "Select the synonym of AMICABLE.", options: ["Hostile", "Friendly", "Rude", "Distant"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Amicable' means having a spirit of friendliness; without serious disagreement or rancor.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Amicable' মানে বন্ধুত্বপূর্ণ বা শান্তিপুর্ণ।</p></div><p class="text-xs text-slate-500 italic border-t border-slate-700 pt-2">Other options: Hostile (শত্রুতাপূর্ণ - Antonym), Rude (অভদ্র)।</p></div>`},
            {q: "Select the antonym of CALLOUS.", options: ["Insensitive", "Sympathetic", "Hard", "Cruel"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Callous' means showing or having an insensitive and cruel disregard for others. 'Sympathetic' is the opposite.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Callous' মানে অনুভূতিহীন বা নিষ্ঠুর। 'Sympathetic' মানে সহানুভূতিশীল।</p></div></div>`},
            {q: "Select the synonym of CAPRICIOUS.", options: ["Stable", "Fickle", "Constant", "Reliable"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Capricious' means given to sudden and unaccountable changes of mood or behavior; fickle.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Capricious' মানে খামখেয়ালি বা চঞ্চলমতি।</p></div></div>`},
            {q: "Select the synonym of CENSURE.", options: ["Praise", "Criticize", "Approve", "Encourage"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Censure' means to express severe disapproval of (someone or something), especially in a formal statement.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Censure' মানে নিন্দা করা বা তিরস্কার করা।</p></div></div>`},
            {q: "Select the antonym of EPHEMERAL.", options: ["Short-lived", "Transitory", "Permanent", "Fleeting"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Ephemeral' means lasting for a very short time. 'Permanent' is the opposite.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Ephemeral' মানে ক্ষণস্থায়ী। 'Permanent' মানে স্থায়ী।</p></div></div>`},
            {q: "Select the synonym of ESOTERIC.", options: ["Common", "Simple", "Abstruse", "Public"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Esoteric' means intended for or likely to be understood by only a small number of people with specialized knowledge.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Esoteric' মানে দুর্বোধ্য বা গোপনীয় (যা কেবল কিছু বিশেষ ব্যক্তি বোঝে)।</p></div></div>`},
            {q: "Select the synonym of EXONERATE.", options: ["Accuse", "Convict", "Absolve", "Blame"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Exonerate' means to absolve (someone) from blame for a fault or wrongdoing.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Exonerate' মানে দোষমুক্তি দেওয়া বা বেকসুর খালাস দেওয়া।</p></div></div>`},
            {q: "Select the synonym of GULLIBLE.", options: ["Astute", "Suspicious", "Credulous", "Cynical"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Gullible' means easily persuaded to believe something; naive. 'Credulous' has a similar meaning.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Gullible' মানে যে সহজেই অন্যকে বিশ্বাস করে (বোকা)।</p></div><p class="text-xs text-slate-500 italic border-t border-slate-700 pt-2">Antonyms: Astute, Cynical.</p></div>`},
            {q: "Select the antonym of INEPT.", options: ["Clumsy", "Skilful", "Awkward", "Incompetent"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Inept' means having or showing no skill; clumsy. 'Skilful' is the opposite.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Inept' মানে অদক্ষ বা আনাড়ি। 'Skilful' মানে দক্ষ।</p></div></div>`},
            {q: "Select the synonym of JETTISON.", options: ["Keep", "Discard", "Accept", "Preserve"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Jettison' means to throw or drop (something) from an aircraft or ship; to abandon or discard.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Jettison' মানে ভার কমানোর জন্য ফেলে দেওয়া বা বর্জন করা।</p></div></div>`},
            {q: "Select the synonym of LACONIC.", options: ["Verbose", "Wordy", "Concise", "Talkative"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Laconic' means using very few words.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Laconic' মানে স্বল্পভাষী বা সংক্ষিপ্ত।</p></div><p class="text-xs text-slate-500 italic border-t border-slate-700 pt-2">Antonyms: Verbose, Wordy, Talkative.</p></div>`},
            {q: "Select the synonym of LOQUACIOUS.", options: ["Silent", "Talkative", "Reticent", "Bashful"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Loquacious' means tending to talk a great deal; talkative.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Loquacious' মানে বাচাল বা বেশি কথা বলে যে।</p></div></div>`},
            {q: "Select the synonym of MUNDANE.", options: ["Exciting", "Extraordinary", "Ordinary", "Heavenly"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Mundane' means lacking interest or excitement; dull; of this earthly world.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Mundane' মানে জাগতিক, সাধারণ বা একঘেয়ে।</p></div></div>`},
            {q: "Select the synonym of OSTENTATIOUS.", options: ["Modest", "Showy", "Plain", "Humble"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Ostentatious' means characterized by vulgar or pretentious display; designed to impress or attract notice.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Ostentatious' মানে জাঁকজমকপূর্ণ বা লোকদেখানো।</p></div></div>`},
            {q: "Select the synonym of PARSIMONIOUS.", options: ["Generous", "Extravagant", "Miserly", "Wasteful"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Parsimonious' means unwillingness to spend money or use resources; stingy or frugal.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Parsimonious' মানে কৃপণ বা ব্যয়কুণ্ঠ।</p></div></div>`},
            {q: "Select the synonym of PERILOUS.", options: ["Safe", "Secure", "Dangerous", "Stable"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Perilous' means full of danger or risk.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Perilous' মানে বিপজ্জনক বা ঝুঁকিপূর্ণ।</p></div></div>`},
            {q: "Select the synonym of PRAGMATIC.", options: ["Idealistic", "Practical", "Theoretical", "Dreamy"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Pragmatic' means dealing with things sensibly and realistically.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Pragmatic' মানে ব্যবহারিক বা বাস্তবসম্মত।</p></div></div>`},
            {q: "Select the synonym of SCRUPULOUS.", options: ["Careless", "Dishonest", "Diligent/Honest", "Lazy"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Scrupulous' means diligent, thorough, and extremely attentive to details; or very concerned to avoid doing wrong.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Scrupulous' মানে নীতিবান, বিবেকবান বা অতি সতর্ক।</p></div></div>`},
            {q: "Select the synonym of TENACIOUS.", options: ["Weak", "Persistent", "Yielding", "Unsure"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Tenacious' means tending to keep a firm hold of something; clinging or adhering closely.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Tenacious' মানে নাছোড়বান্দা বা দৃঢ়প্রতিজ্ঞ।</p></div></div>`},
            {q: "Select the synonym of VINDICATE.", options: ["Accuse", "Convict", "Justify", "Blame"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Vindicate' means to clear (someone) of blame or suspicion; show or prove to be right.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Vindicate' মানে নির্দোষ প্রমাণ করা বা সত্যতা প্রতিপাদন করা।</p></div></div>`},
            {q: "Select the synonym of ZEAL.", options: ["Apathy", "Indifference", "Enthusiasm", "Laziness"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Zeal' means great energy or enthusiasm in pursuit of a cause or an objective.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Zeal' মানে প্রবল উৎসাহ বা উদ্দীপনা।</p></div></div>`},
            {q: "Select the synonym of BENIGN.", options: ["Malignant", "Harmful", "Gentle/Kind", "Cruel"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Benign' means gentle and kindly; (of a disease) not harmful in effect.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Benign' মানে সদয় বা নিরীহ।</p></div></div>`},
            {q: "Select the synonym of DEBACLE.", options: ["Success", "Triumph", "Fiasco/Failure", "Victory"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Debacle' means a sudden and ignominious failure; a fiasco.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Debacle' মানে চরম ব্যর্থতা বা পতন।</p></div></div>`},
            {q: "Select the synonym of ELOQUENT.", options: ["Inarticulate", "Fluent/Expressive", "Silent", "Weak"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Eloquent' means fluent or persuasive in speaking or writing.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Eloquent' মানে বাকপটু বা প্রাঞ্জল।</p></div></div>`},
            {q: "Select the synonym of GRANDIOSE.", options: ["Modest", "Simple", "Magnificent/Imposing", "Tiny"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-yellow-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">'Grandiose' means impressive and imposing in appearance or style, especially pretentiously so.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Grandiose' মানে জাঁকালো বা আড়ম্বরপূর্ণ।</p></div></div>`}
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;
        let startTime;

        // Elements
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const currentQNum = document.getElementById('current-q-num');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress-bar');
        const feedbackSection = document.getElementById('feedback-section');
        const feedbackMessage = document.getElementById('feedback-message');
        const explanationContent = document.getElementById('explanation-content');
        const toggleExplanationBtn = document.getElementById('toggle-explanation-btn');
        const nextBtn = document.getElementById('next-btn');
        const finishBtn = document.getElementById('finish-btn');

        // Functions
        function loadQuestion() {
            const q = questionsTest19[currentQuestion];
            answered = false;
            
            // Update UI
            currentQNum.innerText = currentQuestion + 1;
            questionText.innerText = q.q;
            scoreDisplay.innerText = `Score: ${score}`;
            
            // Update Progress Bar
            const progress = ((currentQuestion) / questionsTest19.length) * 100;
            progressBar.style.width = `${progress}%`;

            // Reset Feedback
            feedbackSection.classList.add('hidden');
            explanationContent.classList.add('hidden');
            explanationContent.innerHTML = q.explanation;
            toggleExplanationBtn.innerHTML = '<span class="bg-yellow-500/10 p-2 rounded-lg mr-3"><i class="fas fa-lightbulb"></i></span><span class="underline decoration-yellow-500/30 underline-offset-4">See Detailed Solution</span>';
            nextBtn.classList.add('hidden');
            finishBtn.classList.add('hidden');

            // Render Options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-5 rounded-xl border border-slate-700/50 bg-slate-800/40 hover:bg-slate-700/60 hover:border-yellow-500/50 transition-all duration-200 font-medium text-slate-300 flex justify-between items-center group backdrop-blur-sm";
                btn.innerHTML = `<span class="flex items-center"><span class="w-8 h-8 rounded-full bg-slate-700 text-slate-400 flex items-center justify-center font-bold mr-4 group-hover:bg-yellow-500 group-hover:text-slate-900 transition-colors text-sm">${String.fromCharCode(65 + index)}</span> ${opt}</span>`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, selectedBtn) {
            if (answered) return;
            answered = true;
            
            const q = questionsTest19[currentQuestion];
            const allBtns = optionsContainer.children;
            
            if (selectedIndex === q.correct) {
                score++;
                selectedBtn.className = "w-full text-left p-5 rounded-xl border border-green-500 bg-green-500/10 flex justify-between items-center transition-all shadow-[0_0_15px_rgba(34,197,94,0.2)]";
                selectedBtn.innerHTML = `<span class="flex items-center text-white font-bold"><span class="w-8 h-8 rounded-full bg-green-500 text-slate-900 flex items-center justify-center font-bold mr-4 text-sm">${String.fromCharCode(65 + selectedIndex)}</span> ${q.options[selectedIndex]}</span><i class="fas fa-check-circle text-green-400 text-2xl drop-shadow-lg"></i>`;
                
                feedbackMessage.className = "flex items-center mb-6 p-4 rounded-xl bg-green-900/20 border border-green-500/30 text-green-300";
                feedbackMessage.innerHTML = '<div class="w-10 h-10 rounded-full bg-green-500/20 flex items-center justify-center mr-4"><i class="fas fa-check text-green-400"></i></div> <span class="font-bold">Correct Answer! Well done.</span>';
            } else {
                selectedBtn.className = "w-full text-left p-5 rounded-xl border border-red-500 bg-red-500/10 flex justify-between items-center transition-all";
                selectedBtn.innerHTML = `<span class="flex items-center text-red-100"><span class="w-8 h-8 rounded-full bg-red-500 text-white flex items-center justify-center font-bold mr-4 text-sm">${String.fromCharCode(65 + selectedIndex)}</span> ${q.options[selectedIndex]}</span><i class="fas fa-times-circle text-red-400 text-2xl"></i>`;
                
                const correctBtn = allBtns[q.correct];
                correctBtn.className = "w-full text-left p-5 rounded-xl border border-green-500 bg-green-500/10 flex justify-between items-center transition-all shadow-[0_0_15px_rgba(34,197,94,0.2)] opacity-100";
                correctBtn.innerHTML = `<span class="flex items-center text-white font-bold"><span class="w-8 h-8 rounded-full bg-green-500 text-slate-900 flex items-center justify-center font-bold mr-4 text-sm">${String.fromCharCode(65 + q.correct)}</span> ${q.options[q.correct]}</span><i class="fas fa-check-circle text-green-400 text-2xl"></i>`;

                feedbackMessage.className = "flex items-center mb-6 p-4 rounded-xl bg-red-900/20 border border-red-500/30 text-red-300";
                feedbackMessage.innerHTML = `<div class="w-10 h-10 rounded-full bg-red-500/20 flex items-center justify-center mr-4"><i class="fas fa-times text-red-400"></i></div> <span>Incorrect. The correct answer is <span class="font-bold text-green-400 border-b border-green-400/30 pb-0.5">${q.options[q.correct]}</span></span>`;
            }

            for (let btn of allBtns) {
                btn.disabled = true;
                if (!btn.className.includes('green') && !btn.className.includes('red')) {
                     btn.classList.add('opacity-50', 'cursor-not-allowed');
                     btn.classList.remove('hover:bg-slate-700/60', 'hover:border-yellow-500/50');
                }
            }

            feedbackSection.classList.remove('hidden');
            scoreDisplay.innerText = `Score: ${score}`;

            if (currentQuestion < questionsTest19.length - 1) {
                nextBtn.classList.remove('hidden');
            } else {
                finishBtn.classList.remove('hidden');
            }
        }

        function toggleExplanation() {
            if (explanationContent.classList.contains('hidden')) {
                explanationContent.classList.remove('hidden');
                explanationContent.classList.add('fade-in');
                toggleExplanationBtn.innerHTML = '<span class="bg-yellow-500/10 p-2 rounded-lg mr-3"><i class="fas fa-eye-slash"></i></span><span class="underline decoration-yellow-500/30 underline-offset-4">Hide Solution</span>';
            } else {
                explanationContent.classList.add('hidden');
                toggleExplanationBtn.innerHTML = '<span class="bg-yellow-500/10 p-2 rounded-lg mr-3"><i class="fas fa-lightbulb"></i></span><span class="underline decoration-yellow-500/30 underline-offset-4">See Detailed Solution</span>';
            }
        }

        function nextQuestion() {
            currentQuestion++;
            loadQuestion();
        }

        function finishQuiz() {
            const endTime = new Date();
            const timeDiff = Math.floor((endTime - startTime) / 1000); // seconds
            const minutes = Math.floor(timeDiff / 60);
            const seconds = timeDiff % 60;
            const timeString = `${minutes}m ${seconds}s`;
            
            // Calc stats
            const total = questionsTest19.length;
            const accuracy = Math.round((score / total) * 100);
            const wrongAnswers = total - score;
            const sscScore = (score * 2) - (wrongAnswers * 0.5);
            
            // Get user name from URL params to pass it back
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name') || "Student";

            // Redirect to Master Index with results (Action = result)
            // Note: testId is set to test19
            const redirectUrl = `index.html?action=result&score=${score}&total=${total}&accuracy=${accuracy}&time=${encodeURIComponent(timeString)}&sscScore=${sscScore}&name=${encodeURIComponent(name)}&testId=test19`;
            
            window.location.href = redirectUrl;
        }
        
        // Start on load
        window.onload = function() {
            startTime = new Date();
            loadQuestion();
        };

        // Expose to window for buttons
        window.checkAnswer = checkAnswer;
        window.toggleExplanation = toggleExplanation;
        window.nextQuestion = nextQuestion;
        window.finishQuiz = finishQuiz;
    </script>
</body>
</html>
