    <script>

            {q: "What is a 'Bolt from the blue'?", options: ["A thunderstorm", "An unexpected shock/surprise", "A blue lightning", "A winning stroke"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">A sudden and unexpected event or piece of news.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Bolt from the blue' মানে বিনা মেঘে বজ্রপাত বা সম্পূর্ণ অপ্রত্যাশিত আঘাত।</p></div></div>`},
            {q: "To keep someone 'At arm's length' means:", options: ["To fight", "To keep at a distance/avoid intimacy", "To hug someone", "To measure arm length"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">To avoid being too friendly with or close to someone.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'At arm's length' মানে নিরাপদ দূরত্ব বজায় রাখা বা ঘনিষ্ঠ না হওয়া।</p></div></div>`},

            {q: "The scenery 'Beggars description':", options: ["Is very poor", "Cannot be described", "Is described by a beggar", "Is ugly"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">To be impossible to describe or explain adequately.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Beggar description' মানে বর্ণনাতীত (যা বর্ণনা করা যায় না)।</p></div></div>`},
            {q: "To 'Blow one's own trumpet':", options: ["To play music", "To praise oneself/Boast", "To shout loudly", "To be humble"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">To talk boastfully about one's achievements.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Blow one's own trumpet' মানে নিজের ঢাক নিজে পেটানো (আত্মপ্রশংসা করা)।</p></div></div>`},
            {q: "To 'Break the ice' means:", options: ["To smash ice", "To start a conversation", "To create trouble", "To cool down"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">To do or say something to relieve tension or get conversation going.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Break the ice' মানে নীরবতা ভেঙে কথা শুরু করা।</p></div></div>`},
            {q: "To 'Bury the hatchet' is to:", options: ["Hide a weapon", "Dig a hole", "Make peace/End a quarrel", "Start a war"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">To end a quarrel or conflict and become friendly.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Bury the hatchet' মানে বিবাদ মিটিয়ে ফেলা বা শত্রুতা শেষ করা।</p></div></div>`},
            {q: "By 'Hook or by crook' means:", options: ["Using a hook", "By fair or foul means", "By playing cricket", "By mistake"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">By any possible means, whether honest or dishonest.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'By hook or by crook' মানে ছলে-বলে-কৌশলে (যে কোনো উপায়ে)।</p></div></div>`},
            {q: "Something that is 'Child's play' is:", options: ["A toy", "Very easy task", "A game", "Foolish"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">A task which is easily accomplished.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Child's play' মানে ছেলের হাতের মোয়া বা খুব সহজ কাজ।</p></div></div>`},
            {q: "To 'Cry for the moon' means:", options: ["To cry at night", "To want something impossible", "To be very sad", "To want to go to space"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">To desire something that is impossible to obtain.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Cry for the moon' মানে বামন হয়ে চাঁদে হাত বা অসম্ভব কিছু চাওয়া।</p></div></div>`},
            {q: "To 'Face the music' is to:", options: ["Listen to songs", "Face the consequences", "Attend a concert", "Enjoy oneself"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">To confront the unpleasant consequences of one's actions.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Face the music' মানে কৃতকর্মের ফল ভোগ করা বা তিরস্কৃত হওয়া।</p></div></div>`},
            {q: "What is 'French leave'?", options: ["Leave without permission", "A holiday in France", "Official leave", "Resignation"], correct: 0, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">An abrupt or unannounced departure; absence without permission.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'French leave' মানে অনুমতি ছাড়া ছুটি বা কাজ থেকে পালানো।</p></div></div>`},
            {q: "To 'Get into hot water' means:", options: ["To take a hot bath", "To be in trouble", "To cook food", "To swim"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">To be in difficult or serious trouble.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Get into hot water' মানে বিপদে পড়া বা ঝামেলায় জড়ানো।</p></div></div>`},
            {q: "To be 'Hand in glove' means:", options: ["Wearing gloves", "Fighting", "In close association/Collusion", "Working separately"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">In close collusion or association.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Hand in glove' মানে ঘনিষ্ঠ সম্পর্ক বা যোগসাজশ (অনেক সময় খারাপ অর্থে)।</p></div></div>`},
            {q: "A 'Herculean task' is:", options: ["An easy task", "A job for heroes", "A very difficult task requiring great effort", "A daily routine"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">A task requiring great strength or effort.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Herculean task' মানে অত্যন্ত কঠিন কাজ।</p></div></div>`},
            {q: "To do something 'In cold blood':", options: ["When it is cold", "Deliberately and without emotion", "Accidentally", "In anger"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">Without feeling or mercy; ruthlessly.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'In cold blood' মানে ঠাণ্ডা মাথায় বা নৃশংসভাবে।</p></div></div>`},

            {q: "To 'Make a clean breast of' means:", options: ["To clean oneself", "To confess/Admit truth", "To deny charges", "To be proud"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">To speak openly and honestly about something (especially a mistake or crime).</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Make a clean breast of' মানে দোষ স্বীকার করা বা সত্য প্রকাশ করা।</p></div></div>`},
            {q: "The agreement was declared 'Null and void'.", options: ["Valid", "Important", "Invalid/Not legally binding", "Completed"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">Having no legal force.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Null and void' মানে বাতিল বা অকার্যকর।</p></div></div>`},
            {q: "To be 'Out of the woods':", options: ["Out of the forest", "Out of danger/difficulty", "Lost", "Confused"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">Out of danger or difficulty.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Out of the woods' মানে বিপদ বা সমস্যা থেকে মুক্ত।</p></div></div>`},
            {q: "We must weigh the 'Pros and cons'.", options: ["Friends and enemies", "Advantages and disadvantages", "Rich and poor", "Beginning and end"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">The favorable and unfavorable factors; arguments for and against.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Pros and cons' মানে খুঁটিনাটি বা ভালো-মন্দ দিক।</p></div></div>`},
            {q: "Save money for a 'Rainy day'.", options: ["For monsoon", "For a holiday", "For a future time of need/difficulty", "For buying clothes"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">A future time of financial need.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Rainy day' মানে দুঃসময় বা প্রয়োজনের সময়।</p></div></div>`},
            {q: "To 'Read between the lines':", options: ["To read carefully", "To understand the hidden meaning", "To read useless things", "To skip lines"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">To look for or discover a meaning that is implied rather than explicitly stated.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Read between the lines' মানে অন্তনিহিত অর্থ বোঝা বা যা লেখা নেই তা বোঝা।</p></div></div>`},
            {q: "He 'Turned a deaf ear' to my advice.", options: ["He listened carefully", "He refused to listen/ignored", "He hurt his ear", "He agreed"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-pink-400 text-xs uppercase mb-1">English Definition</p><p class="text-slate-200">To refuse to listen or respond to a statement or request.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Turn a deaf ear' মানে কথা না শোনা বা অগ্রাহ্য করা।</p></div></div>`}
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;
        let startTime;

        // Elements
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const currentQNum = document.getElementById('current-q-num');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress-bar');
        const feedbackSection = document.getElementById('feedback-section');
        const feedbackMessage = document.getElementById('feedback-message');
        const explanationContent = document.getElementById('explanation-content');
        const toggleExplanationBtn = document.getElementById('toggle-explanation-btn');
        const nextBtn = document.getElementById('next-btn');
        const finishBtn = document.getElementById('finish-btn');

        // Functions
        function loadQuestion() {
            const q = questionsTest20[currentQuestion];
            answered = false;
            
            // Update UI
            currentQNum.innerText = currentQuestion + 1;
            questionText.innerText = q.q;
            scoreDisplay.innerText = `Score: ${score}`;
            
            // Update Progress Bar
            const progress = ((currentQuestion) / questionsTest20.length) * 100;
            progressBar.style.width = `${progress}%`;

            // Reset Feedback
            feedbackSection.classList.add('hidden');
            explanationContent.classList.add('hidden');
            explanationContent.innerHTML = q.explanation;
            toggleExplanationBtn.innerHTML = '<span class="bg-pink-500/10 p-2 rounded-lg mr-3"><i class="fas fa-lightbulb"></i></span><span class="underline decoration-pink-500/30 underline-offset-4">See Detailed Solution</span>';
            nextBtn.classList.add('hidden');
            finishBtn.classList.add('hidden');

            // Render Options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-5 rounded-xl border border-slate-700/50 bg-slate-800/40 hover:bg-slate-700/60 hover:border-pink-500/50 transition-all duration-200 font-medium text-slate-300 flex justify-between items-center group backdrop-blur-sm";
                btn.innerHTML = `<span class="flex items-center"><span class="w-8 h-8 rounded-full bg-slate-700 text-slate-400 flex items-center justify-center font-bold mr-4 group-hover:bg-pink-500 group-hover:text-slate-900 transition-colors text-sm">${String.fromCharCode(65 + index)}</span> ${opt}</span>`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, selectedBtn) {
            if (answered) return;
            answered = true;
            
            const q = questionsTest20[currentQuestion];
            const allBtns = optionsContainer.children;
            
            if (selectedIndex === q.correct) {
                score++;
                selectedBtn.className = "w-full text-left p-5 rounded-xl border border-green-500 bg-green-500/10 flex justify-between items-center transition-all shadow-[0_0_15px_rgba(34,197,94,0.2)]";
                selectedBtn.innerHTML = `<span class="flex items-center text-white font-bold"><span class="w-8 h-8 rounded-full bg-green-500 text-slate-900 flex items-center justify-center font-bold mr-4 text-sm">${String.fromCharCode(65 + selectedIndex)}</span> ${q.options[selectedIndex]}</span><i class="fas fa-check-circle text-green-400 text-2xl drop-shadow-lg"></i>`;
                
                feedbackMessage.className = "flex items-center mb-6 p-4 rounded-xl bg-green-900/20 border border-green-500/30 text-green-300";
                feedbackMessage.innerHTML = '<div class="w-10 h-10 rounded-full bg-green-500/20 flex items-center justify-center mr-4"><i class="fas fa-check text-green-400"></i></div> <span class="font-bold">Correct Answer! Well done.</span>';
            } else {
                selectedBtn.className = "w-full text-left p-5 rounded-xl border border-red-500 bg-red-500/10 flex justify-between items-center transition-all";
                selectedBtn.innerHTML = `<span class="flex items-center text-red-100"><span class="w-8 h-8 rounded-full bg-red-500 text-white flex items-center justify-center font-bold mr-4 text-sm">${String.fromCharCode(65 + selectedIndex)}</span> ${q.options[selectedIndex]}</span><i class="fas fa-times-circle text-red-400 text-2xl"></i>`;
                
                const correctBtn = allBtns[q.correct];
                correctBtn.className = "w-full text-left p-5 rounded-xl border border-green-500 bg-green-500/10 flex justify-between items-center transition-all shadow-[0_0_15px_rgba(34,197,94,0.2)] opacity-100";
                correctBtn.innerHTML = `<span class="flex items-center text-white font-bold"><span class="w-8 h-8 rounded-full bg-green-500 text-slate-900 flex items-center justify-center font-bold mr-4 text-sm">${String.fromCharCode(65 + q.correct)}</span> ${q.options[q.correct]}</span><i class="fas fa-check-circle text-green-400 text-2xl"></i>`;

                feedbackMessage.className = "flex items-center mb-6 p-4 rounded-xl bg-red-900/20 border border-red-500/30 text-red-300";
                feedbackMessage.innerHTML = `<div class="w-10 h-10 rounded-full bg-red-500/20 flex items-center justify-center mr-4"><i class="fas fa-times text-red-400"></i></div> <span>Incorrect. The correct answer is <span class="font-bold text-green-400 border-b border-green-400/30 pb-0.5">${q.options[q.correct]}</span></span>`;
            }

            for (let btn of allBtns) {
                btn.disabled = true;
                if (!btn.className.includes('green') && !btn.className.includes('red')) {
                     btn.classList.add('opacity-50', 'cursor-not-allowed');
                     btn.classList.remove('hover:bg-slate-700/60', 'hover:border-pink-500/50');
                }
            }

            feedbackSection.classList.remove('hidden');
            scoreDisplay.innerText = `Score: ${score}`;

            if (currentQuestion < questionsTest20.length - 1) {
                nextBtn.classList.remove('hidden');
            } else {
                finishBtn.classList.remove('hidden');
            }
        }

        function toggleExplanation() {
            if (explanationContent.classList.contains('hidden')) {
                explanationContent.classList.remove('hidden');
                explanationContent.classList.add('fade-in');
                toggleExplanationBtn.innerHTML = '<span class="bg-pink-500/10 p-2 rounded-lg mr-3"><i class="fas fa-eye-slash"></i></span><span class="underline decoration-pink-500/30 underline-offset-4">Hide Solution</span>';
            } else {
                explanationContent.classList.add('hidden');
                toggleExplanationBtn.innerHTML = '<span class="bg-pink-500/10 p-2 rounded-lg mr-3"><i class="fas fa-lightbulb"></i></span><span class="underline decoration-pink-500/30 underline-offset-4">See Detailed Solution</span>';
            }
        }

        function nextQuestion() {
            currentQuestion++;
            loadQuestion();
        }

        function finishQuiz() {
            const endTime = new Date();
            const timeDiff = Math.floor((endTime - startTime) / 1000); // seconds
            const minutes = Math.floor(timeDiff / 60);
            const seconds = timeDiff % 60;
            const timeString = `${minutes}m ${seconds}s`;
            
            // Calc stats
            const total = questionsTest20.length;
            const accuracy = Math.round((score / total) * 100);
            const wrongAnswers = total - score;
            const sscScore = (score * 2) - (wrongAnswers * 0.5);
            
            // Get user name from URL params to pass it back
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name') || "Student";

            // Redirect to Master Index with results (Action = result)
            // Note: testId is set to test20
            const redirectUrl = `index.html?action=result&score=${score}&total=${total}&accuracy=${accuracy}&time=${encodeURIComponent(timeString)}&sscScore=${sscScore}&name=${encodeURIComponent(name)}&testId=test20`;
            
            window.location.href = redirectUrl;
        }
        
        // Start on load
        window.onload = function() {
            startTime = new Date();
            loadQuestion();
        };

        // Expose to window for buttons
        window.checkAnswer = checkAnswer;
        window.toggleExplanation = toggleExplanation;
        window.nextQuestion = nextQuestion;
        window.finishQuiz = finishQuiz;
    </script>
</body>
</html>
