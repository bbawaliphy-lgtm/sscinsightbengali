    <script>
        // Test Data (Test 29 - Fill in the Blanks)
        const questionsTest29 = [
            {q: "The rich should not look _____ the poor.", options: ["up", "down", "down upon", "after"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Phrasal Verb</p><p class="text-slate-200">'Look down upon' means to regard with contempt or consider someone inferior.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Look down upon' মানে ঘৃণা করা বা নিচু চোখে দেখা।</p></div></div>`},
            {q: "He gives a _____ account of the events.", options: ["vivid", "vivacious", "vaporous", "valid"], correct: 0, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Vocabulary</p><p class="text-slate-200">'Vivid' means producing powerful feelings or strong, clear images in the mind.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Vivid account' মানে প্রাণবন্ত বা স্পষ্ট বর্ণনা।</p></div></div>`},
            {q: "Scarcely had the thief seen the police _____ he ran away.", options: ["than", "then", "when", "that"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'Scarcely' and 'Hardly' are always followed by 'when'. 'No sooner' is followed by 'than'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Scarcely' থাকলে বাক্যের অপর অংশে 'when' বসে।</p></div></div>`},
            {q: "The building was _____ by the fire.", options: ["destroyed", "razed", "gutted", "pulled"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Vocabulary</p><p class="text-slate-200">'Gutted' is used specifically when the inside of a building is destroyed by fire. 'Razed' implies leveled to the ground.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">আগুনে পুড়ে বাড়ির ভেতরের সব শেষ হয়ে গেলে 'gutted' শব্দটি ব্যবহার করা হয়।</p></div></div>`},
            {q: "He is indifferent _____ praise or blame.", options: ["of", "to", "for", "in"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Fixed Preposition</p><p class="text-slate-200">'Indifferent' takes the preposition 'to'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">উদাসীন বোঝাতে 'indifferent to' বসে।</p></div></div>`},
            {q: "A large _____ of people attended the meeting.", options: ["crowd", "mob", "number", "flock"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Grammar/Vocabulary</p><p class="text-slate-200">We say 'A large number of people'. 'Crowd' is a collective noun (A large crowd gathered, not a large crowd of people). 'Mob' is negative.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">সাধারণত 'A large number of people' বলা হয়।</p></div></div>`},
            {q: "The patient died _____ the doctor came.", options: ["after", "before", "when", "while"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">Past Perfect Tense sequence: The action happened first (died) uses 'had died' (implied context) before the second action (came). Contextually: 'The patient had died before the doctor came'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">ডাক্তার আসার আগেই রোগী মারা গেল। (Before)।</p></div></div>`},
            {q: "He is the _____ of the two brothers.", options: ["tallest", "taller", "tall", "most tall"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">When comparing two persons/things using 'of the', we use the comparative degree with 'the'. Correct: 'the taller'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">দুইজনের মধ্যে তুলনা বোঝালে Comparative degree (taller) হয় এবং তার আগে 'the' বসে।</p></div></div>`},
            {q: "She has no pen to write _____.", options: ["with", "in", "by", "on"], correct: 0, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Preposition</p><p class="text-slate-200">We write 'with' a pen (instrument). The preposition must not be omitted at the end of the sentence in such constructions.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">কলম দিয়ে লেখা হয়, তাই 'write with' হবে।</p></div></div>`},
            {q: "He dealt _____ the problem very efficiently.", options: ["in", "with", "at", "on"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Phrasal Verb</p><p class="text-slate-200">'Deal with' means to handle or manage. 'Deal in' means to trade.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">সমস্যা সমাধান বা সামলানো অর্থে 'deal with' বসে।</p></div></div>`},
            {q: "The train _____ before we reached the station.", options: ["left", "has left", "had left", "will leave"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">Past Perfect Tense: The first action (train leaving) takes 'had + V3'. The second action (reaching) takes Simple Past.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">আমরা পৌঁছানোর আগেই ট্রেন ছেড়ে দিয়েছিল। অতীতে দুটি কাজের মধ্যে যেটি আগে ঘটে সেটি Past Perfect (had left) হয়।</p></div></div>`},
            {q: "There is no exception _____ this rule.", options: ["of", "to", "for", "in"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Fixed Preposition</p><p class="text-slate-200">'Exception' takes the preposition 'to'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">ব্যতিক্রম বোঝাতে 'exception to' বসে।</p></div></div>`},
            {q: "Iron is _____ useful metal.", options: ["a", "an", "the", "one"], correct: 0, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Article</p><p class="text-slate-200">'Useful' starts with a vowel 'U' but produces a consonant sound 'Yoo'. Hence, it takes 'a'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Useful' এর উচ্চারণ 'ইউ' (Yu) এর মতো, তাই এর আগে 'a' বসে।</p></div></div>`},
            {q: "I cannot _____ to buy a car.", options: ["afford", "agree", "accept", "adopt"], correct: 0, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Vocabulary</p><p class="text-slate-200">'Afford' means to have enough money to pay for something.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">আর্থিক সামর্থ্য বোঝাতে 'afford' ব্যবহৃত হয়।</p></div></div>`},
            {q: "He is _____ M.A. in English.", options: ["a", "an", "the", "no article"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Article</p><p class="text-slate-200">'M.A.' starts with the sound 'Em' (vowel sound 'A'), so it takes 'an'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">M.A. উচ্চারণে প্রথমে 'এ' আসে, তাই 'an' বসে।</p></div></div>`},
            {q: "The jury _____ divided in their opinions.", options: ["was", "were", "is", "has"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">Collective nouns (Jury) take a plural verb when the members are acting individually or are divided.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">জুরিদের মতামত ভিন্ন ভিন্ন (divided), তাই Verb Plural (were) হবে। একমত হলে Singular হতো।</p></div></div>`},
            {q: "He prevented me _____ doing this work.", options: ["to", "of", "from", "with"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Fixed Preposition</p><p class="text-slate-200">'Prevent' takes 'from' followed by a Gerund.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">বাধা দেওয়া অর্থে 'prevent from' বসে।</p></div></div>`},
            {q: "One of the _____ was absent.", options: ["student", "students", "boy", "teacher"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">'One of the' is followed by a Plural Noun.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'One of the' এর পরে Noun সর্বদা Plural (students) হয়।</p></div></div>`},
            {q: "I have known him _____ a long time.", options: ["since", "for", "from", "in"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Preposition</p><p class="text-slate-200">'For' is used for a period/duration of time.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">দীর্ঘ সময় (Duration) বোঝাতে 'for' বসে।</p></div></div>`},
            {q: "This is the same dog _____ barked at me.", options: ["who", "which", "that", "whom"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">After 'the same', the relative pronoun 'that' is usually used.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'The same' থাকলে Relative Pronoun হিসেবে 'that' বসে।</p></div></div>`},
            {q: "He is addicted _____ gambling.", options: ["with", "in", "to", "of"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Fixed Preposition</p><p class="text-slate-200">'Addicted' takes the preposition 'to'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">আসক্ত অর্থে 'addicted to' বসে।</p></div></div>`},
            {q: "The train departed _____ time.", options: ["in", "on", "at", "by"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Preposition</p><p class="text-slate-200">'On time' means exactly at the scheduled time. 'In time' means early enough.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">নির্ধারিত সময়ে বোঝাতে 'on time' বসে।</p></div></div>`},
            {q: "Neither the captain nor the players _____ present.", options: ["was", "were", "is", "has"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">With 'Neither... nor', the verb agrees with the nearest subject (players). 'Players' is plural, so 'were'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">'Nor'-এর পরের Subject (players) অনুযায়ী Verb হবে। তাই 'were' হবে।</p></div></div>`},
            {q: "He is weak _____ Mathematics.", options: ["at", "in", "on", "with"], correct: 1, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Grammar Rule</p><p class="text-slate-200">We say 'weak in' a subject, but 'good at' a subject.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">কোনো বিষয়ে দুর্বল হলে 'weak in' হয়। (কিন্তু দক্ষ হলে 'good at' হয়)।</p></div></div>`},
            {q: "Make haste, _____ you will miss the train.", options: ["and", "but", "or", "so"], correct: 2, explanation: `<div class="space-y-4"><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-sky-400 text-xs uppercase mb-1">Conjunction</p><p class="text-slate-200">'Or' implies a warning or consequence (Otherwise). 'Make haste, otherwise/or you will miss...'.</p></div><div class="bg-slate-800/50 p-3 rounded-lg border border-slate-700"><p class="font-bold text-blue-400 text-xs uppercase mb-1">Bengali Explanation</p><p class="text-slate-200 bengali-text">তাড়াতাড়ি করো, 'নতুবা' (or) ট্রেন মিস করবে।</p></div></div>`}
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;
        let startTime;

        // Elements
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const currentQNum = document.getElementById('current-q-num');
        const scoreDisplay = document.getElementById('score-display');
        const progressBar = document.getElementById('progress-bar');
        const feedbackSection = document.getElementById('feedback-section');
        const feedbackMessage = document.getElementById('feedback-message');
        const explanationContent = document.getElementById('explanation-content');
        const toggleExplanationBtn = document.getElementById('toggle-explanation-btn');
        const nextBtn = document.getElementById('next-btn');
        const finishBtn = document.getElementById('finish-btn');

        // Functions
        function loadQuestion() {
            const q = questionsTest29[currentQuestion];
            answered = false;
            
            // Update UI
            currentQNum.innerText = currentQuestion + 1;
            questionText.innerText = q.q;
            scoreDisplay.innerText = `Score: ${score}`;
            
            // Update Progress Bar
            const progress = ((currentQuestion) / questionsTest29.length) * 100;
            progressBar.style.width = `${progress}%`;

            // Reset Feedback
            feedbackSection.classList.add('hidden');
            explanationContent.classList.add('hidden');
            explanationContent.innerHTML = q.explanation;
            toggleExplanationBtn.innerHTML = '<span class="bg-sky-500/10 p-2 rounded-lg mr-3"><i class="fas fa-lightbulb"></i></span><span class="underline decoration-sky-500/30 underline-offset-4">See Detailed Solution</span>';
            nextBtn.classList.add('hidden');
            finishBtn.classList.add('hidden');

            // Render Options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-5 rounded-xl border border-slate-700/50 bg-slate-800/40 hover:bg-slate-700/60 hover:border-sky-500/50 transition-all duration-200 font-medium text-slate-300 flex justify-between items-center group backdrop-blur-sm";
                btn.innerHTML = `<span class="flex items-center"><span class="w-8 h-8 rounded-full bg-slate-700 text-slate-400 flex items-center justify-center font-bold mr-4 group-hover:bg-sky-500 group-hover:text-slate-900 transition-colors text-sm">${String.fromCharCode(65 + index)}</span> ${opt}</span>`;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, selectedBtn) {
            if (answered) return;
            answered = true;
            
            const q = questionsTest29[currentQuestion];
            const allBtns = optionsContainer.children;
            
            if (selectedIndex === q.correct) {
                score++;
                selectedBtn.className = "w-full text-left p-5 rounded-xl border border-green-500 bg-green-500/10 flex justify-between items-center transition-all shadow-[0_0_15px_rgba(34,197,94,0.2)]";
                selectedBtn.innerHTML = `<span class="flex items-center text-white font-bold"><span class="w-8 h-8 rounded-full bg-green-500 text-slate-900 flex items-center justify-center font-bold mr-4 text-sm">${String.fromCharCode(65 + selectedIndex)}</span> ${q.options[selectedIndex]}</span><i class="fas fa-check-circle text-green-400 text-2xl drop-shadow-lg"></i>`;
                
                feedbackMessage.className = "flex items-center mb-6 p-4 rounded-xl bg-green-900/20 border border-green-500/30 text-green-300";
                feedbackMessage.innerHTML = '<div class="w-10 h-10 rounded-full bg-green-500/20 flex items-center justify-center mr-4"><i class="fas fa-check text-green-400"></i></div> <span class="font-bold">Correct Answer! Well done.</span>';
            } else {
                selectedBtn.className = "w-full text-left p-5 rounded-xl border border-red-500 bg-red-500/10 flex justify-between items-center transition-all";
                selectedBtn.innerHTML = `<span class="flex items-center text-red-100"><span class="w-8 h-8 rounded-full bg-red-500 text-white flex items-center justify-center font-bold mr-4 text-sm">${String.fromCharCode(65 + selectedIndex)}</span> ${q.options[selectedIndex]}</span><i class="fas fa-times-circle text-red-400 text-2xl"></i>`;
                
                const correctBtn = allBtns[q.correct];
                correctBtn.className = "w-full text-left p-5 rounded-xl border border-green-500 bg-green-500/10 flex justify-between items-center transition-all shadow-[0_0_15px_rgba(34,197,94,0.2)] opacity-100";
                correctBtn.innerHTML = `<span class="flex items-center text-white font-bold"><span class="w-8 h-8 rounded-full bg-green-500 text-slate-900 flex items-center justify-center font-bold mr-4 text-sm">${String.fromCharCode(65 + q.correct)}</span> ${q.options[q.correct]}</span><i class="fas fa-check-circle text-green-400 text-2xl"></i>`;

                feedbackMessage.className = "flex items-center mb-6 p-4 rounded-xl bg-red-900/20 border border-red-500/30 text-red-300";
                feedbackMessage.innerHTML = `<div class="w-10 h-10 rounded-full bg-red-500/20 flex items-center justify-center mr-4"><i class="fas fa-times text-red-400"></i></div> <span>Incorrect. The correct answer is <span class="font-bold text-green-400 border-b border-green-400/30 pb-0.5">${q.options[q.correct]}</span></span>`;
            }

            for (let btn of allBtns) {
                btn.disabled = true;
                if (!btn.className.includes('green') && !btn.className.includes('red')) {
                     btn.classList.add('opacity-50', 'cursor-not-allowed');
                     btn.classList.remove('hover:bg-slate-700/60', 'hover:border-sky-500/50');
                }
            }

            feedbackSection.classList.remove('hidden');
            scoreDisplay.innerText = `Score: ${score}`;

            if (currentQuestion < questionsTest29.length - 1) {
                nextBtn.classList.remove('hidden');
            } else {
                finishBtn.classList.remove('hidden');
            }
        }

        function toggleExplanation() {
            if (explanationContent.classList.contains('hidden')) {
                explanationContent.classList.remove('hidden');
                explanationContent.classList.add('fade-in');
                toggleExplanationBtn.innerHTML = '<span class="bg-sky-500/10 p-2 rounded-lg mr-3"><i class="fas fa-eye-slash"></i></span><span class="underline decoration-sky-500/30 underline-offset-4">Hide Solution</span>';
            } else {
                explanationContent.classList.add('hidden');
                toggleExplanationBtn.innerHTML = '<span class="bg-sky-500/10 p-2 rounded-lg mr-3"><i class="fas fa-lightbulb"></i></span><span class="underline decoration-sky-500/30 underline-offset-4">See Detailed Solution</span>';
            }
        }

        function nextQuestion() {
            currentQuestion++;
            loadQuestion();
        }

        function finishQuiz() {
            const endTime = new Date();
            const timeDiff = Math.floor((endTime - startTime) / 1000); // seconds
            const minutes = Math.floor(timeDiff / 60);
            const seconds = timeDiff % 60;
            const timeString = `${minutes}m ${seconds}s`;
            
            // Calc stats
            const total = questionsTest29.length;
            const accuracy = Math.round((score / total) * 100);
            const wrongAnswers = total - score;
            const sscScore = (score * 2) - (wrongAnswers * 0.5);
            
            // Get user name from URL params to pass it back
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name') || "Student";

            // Redirect to Master Index with results (Action = result)
            // Note: testId is set to test29
            const redirectUrl = `index.html?action=result&score=${score}&total=${total}&accuracy=${accuracy}&time=${encodeURIComponent(timeString)}&sscScore=${sscScore}&name=${encodeURIComponent(name)}&testId=test29`;
            
            window.location.href = redirectUrl;
        }
        
        // Start on load
        window.onload = function() {
            startTime = new Date();
            loadQuestion();
        };

        // Expose to window for buttons
        window.checkAnswer = checkAnswer;
        window.toggleExplanation = toggleExplanation;
        window.nextQuestion = nextQuestion;
        window.finishQuiz = finishQuiz;
    </script>
</body>
</html>
